# JVM heap for the Gradle daemon. 2g is enough for a single-module app;
# raising it is the usual first response to an OOM during a Hilt or
# Compose build, so it is called out here rather than left implicit.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Only build what the requested task needs.
org.gradle.configureondemand=false
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX, not the long-dead support library.
android.useAndroidX=true

# Kotlin code style for the IDE's formatter.
kotlin.code.style=official

# BuildConfig is enabled per module in app/build.gradle.kts, not here:
# the global default is deprecated and goes away in AGP 10.

# Each module's R class holds only its own resources, so a dependency's
# resource cannot be referenced by accident.
android.nonTransitiveRClass=true
