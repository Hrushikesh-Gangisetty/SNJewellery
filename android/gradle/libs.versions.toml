# Version catalogue — the single place a dependency version is written.
#
# Same principle as web/lib/config/site.ts and docs/design/tokens.json:
# one home per fact. A version written in a module's build file is a
# version that drifts from the other module's.
#
# Versions added here as each milestone needs them — Hilt in M6.4,
# Supabase and Coil in M6.5 (see ADR-0007). Nothing is listed before it
# is used; an unused dependency is weight in the APK and a thing to
# upgrade.

[versions]
# AGP and Gradle move together. See docs/architecture/android-build.md
# for why this pair, and what to check before changing either.
agp = "8.10.1"
kotlin = "2.1.20"
composeBom = "2025.04.00"

androidxCore = "1.13.1"
androidxLifecycle = "2.8.4"
androidxActivity = "1.9.2"

# KSP's version is Kotlin's version plus its own suffix — the two are
# pinned together and cannot be upgraded independently.
#
# The 1.0.x suffix line is KSP1. The 2.0.x line is KSP2, and Hilt 2.52's
# processor does not support it — its bytecode transform silently stops
# running and every @HiltAndroidApp fails with "Expected ... to have a
# value. Did you forget to apply the Gradle Plugin?". Tried, not guessed.
# Moving to KSP2 means Hilt 2.56.2 or newer, together.
ksp = "2.1.20-1.0.32"
# 2.56.2, not 2.52: Hilt 2.52's metadata reader cannot parse Kotlin 2.1
# classes and fails hiltJavaCompile with "unsupported metadata version".
hilt = "2.56.2"
androidxHiltNavigation = "1.2.0"
# 2.8.x is the first line with type-safe routes — a destination is a
# @Serializable object rather than a string that fails at runtime when it
# is misspelled. M6.10; the graph grows in M7 and M8.
androidxNavigation = "2.8.9"

# Supabase's Kotlin SDK, and the Ktor version it is built against.
# Bumping supabase means checking this — a mismatched engine fails at
# runtime, not at compile time. See docs/architecture/android-build.md §1.
supabase = "3.1.4"
ktor = "3.1.2"
coil = "3.1.0"
# Declared explicitly because the models use @Serializable directly.
# supabase-kt exposes it transitively, but relying on another library's
# transitive API is how a version bump breaks a file that never changed.
kotlinxSerialization = "1.8.0"

# Instrumented tests only — never in the APK. Added in M7.6, where the
# thing to verify is a number (2048px, WebP, under 900KB) on a real
# device rather than something a screenshot can show.
junit = "4.13.2"
androidxTestJunit = "1.2.1"
androidxTestRunner = "1.6.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }

# The BOM pins every Compose artefact, so Compose libraries below carry
# no version of their own — that is the point of it.
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# ADR-0007: Hilt, for compile-time verified injection — a missing binding
# is a build error rather than a crash on a screen opened once a week.
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "androidxHiltNavigation" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidxNavigation" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }

# ADR-0007: Ktor via the Supabase SDK, not Retrofit — the official SDK is
# built on Ktor, so Retrofit would mean running two HTTP stacks.
supabase-bom = { group = "io.github.jan-tennert.supabase", name = "bom", version.ref = "supabase" }
supabase-auth = { group = "io.github.jan-tennert.supabase", name = "auth-kt" }
supabase-postgrest = { group = "io.github.jan-tennert.supabase", name = "postgrest-kt" }
supabase-storage = { group = "io.github.jan-tennert.supabase", name = "storage-kt" }
# OkHttp engine rather than CIO or Android: connection pooling and HTTP/2
# on a phone on mobile data, which is this app's whole context.
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }

coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
# Coil shares the app's OkHttp client, so there is one connection pool
# and one place timeouts are set.
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# Required from Kotlin 2.0: the Compose compiler ships with Kotlin
# itself rather than as a separately versioned artefact.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
# supabase-kt models rows with kotlinx.serialization.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
